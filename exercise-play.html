<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Sequence Memory</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;
  --c-error: #E57373;
  --c-success: #4CAF50;
  --c-warning: #FF9800;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);

  --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 24px; --r-pill: 999px;
  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

html[lang="ar"] body { font-family: var(--f-ar); }
button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* PHONE FRAME */
.stage {
  width: 100vw; height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone {
    width: 100vw; height: 100vh;
    max-height: 100vh;
    border-radius: 0; box-shadow: none;
  }
  .phone::before { display: none; }
}

/* SCREEN */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(155, 126, 222, 0.10), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 124, 123, 0.08), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* TOP BAR */
.topbar {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.exit-btn {
  width: 38px; height: 38px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.7);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.exit-btn:hover {
  background: #fff;
  border-color: rgba(229, 115, 115, 0.4);
  transform: scale(1.05);
}

.exit-btn svg {
  width: 15px; height: 15px;
  stroke: var(--c-slate);
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
}

.exit-btn:hover svg { stroke: var(--c-error); }

/* HUD */
.hud {
  display: flex;
  gap: 6px;
  align-items: center;
}

.hud-box {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 5px 10px;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  border-radius: var(--r-pill);
  font-size: 11.5px;
  font-weight: 700;
  color: var(--c-navy);
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
  font-feature-settings: "tnum";
  transition: all 0.3s ease;
}

.hud-box svg {
  width: 12px; height: 12px;
  stroke: currentColor;
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hud-box.score { color: var(--c-primary); }
.hud-box.level { color: var(--c-secondary); }

.hud-box.lives { padding: 5px 8px; gap: 3px; }

.heart {
  width: 12px; height: 12px;
  fill: var(--c-error);
  transition: all 0.4s ease;
}

.heart.lost {
  fill: rgba(229, 115, 115, 0.2);
  transform: scale(0.85);
}

/* CONTENT */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 20px 24px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  min-height: 0;
}

/* STATUS */
.status-wrap {
  text-align: center;
  display: flex;
  flex-direction: column;
  gap: 4px;
  min-height: 46px;
  justify-content: center;
  opacity: 0;
  animation: fadeUp 0.5s ease 0.1s forwards;
}

.status-text {
  font-size: 16px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: -0.2px;
  transition: opacity 0.3s ease, transform 0.3s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.status-text .pulse-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: var(--c-primary);
  animation: pulseDot 1s ease-in-out infinite;
}

@keyframes pulseDot {
  0%, 100% { transform: scale(1); opacity: 1; }
  50%      { transform: scale(1.4); opacity: 0.5; }
}

html[lang="ar"] .status-text { font-family: var(--f-ar); font-size: 15.5px; }

.status-sub {
  font-size: 12px;
  color: var(--c-slate);
  font-weight: 500;
}

html[lang="ar"] .status-sub { font-family: var(--f-ar); font-size: 13px; }

@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

/* PROGRESS PIPS */
.pips-row {
  display: flex;
  justify-content: center;
  gap: 5px;
  padding: 2px 0 4px;
  min-height: 20px;
}

.pip {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(14, 124, 123, 0.12);
  transition: all 0.3s ease;
}

.pip.filled {
  background: var(--g-brand);
  transform: scale(1.1);
  box-shadow: 0 0 6px rgba(14, 124, 123, 0.4);
}

.pip.correct {
  background: var(--c-success);
  box-shadow: 0 0 6px rgba(76, 175, 80, 0.5);
}

.pip.wrong {
  background: var(--c-error);
  box-shadow: 0 0 6px rgba(229, 115, 115, 0.5);
}

/* PLAY AREA (GRID) */
.play-area {
  flex: 1;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  grid-template-rows: repeat(3, 1fr);
  gap: 12px;
  min-height: 0;
  padding: 4px 0;
}

.tile {
  position: relative;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-xl);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 46px;
  cursor: pointer;
  transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
  box-shadow: 0 6px 20px rgba(15, 44, 76, 0.05);
  opacity: 0;
  transform: scale(0.85);
  animation: tileIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.tile:nth-child(1) { animation-delay: 0.15s; }
.tile:nth-child(2) { animation-delay: 0.20s; }
.tile:nth-child(3) { animation-delay: 0.25s; }
.tile:nth-child(4) { animation-delay: 0.30s; }
.tile:nth-child(5) { animation-delay: 0.35s; }
.tile:nth-child(6) { animation-delay: 0.40s; }

@keyframes tileIn {
  to { opacity: 1; transform: scale(1); }
}

.tile::before {
  content: '';
  position: absolute;
  inset: 0;
  background: var(--g-brand);
  opacity: 0;
  transition: opacity 0.22s ease;
  z-index: 0;
}

.tile-emoji {
  position: relative;
  z-index: 2;
  transition: transform 0.22s ease;
}

/* Idle hover */
.tile.idle:hover {
  border-color: rgba(14, 124, 123, 0.3);
  transform: translateY(-3px);
  box-shadow: 0 12px 28px rgba(15, 44, 76, 0.08);
}

.tile.idle:active {
  transform: scale(0.95);
}

/* ✅ Showing state (during sequence playback) */
.tile.showing {
  border-color: transparent;
  box-shadow:
    0 12px 32px rgba(14, 124, 123, 0.4),
    0 0 0 4px rgba(14, 124, 123, 0.15);
  transform: scale(1.05);
}

.tile.showing::before { opacity: 1; }

.tile.showing .tile-emoji {
  transform: scale(1.2);
  filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.25));
}

/* User tap */
.tile.tapped {
  transform: scale(0.92);
  border-color: var(--c-primary);
  box-shadow: 0 0 0 4px rgba(14, 124, 123, 0.15);
}

/* Correct tap */
.tile.correct {
  border-color: var(--c-success);
  background: linear-gradient(135deg, rgba(76, 175, 80, 0.08), rgba(102, 187, 106, 0.04));
  box-shadow: 0 0 0 4px rgba(76, 175, 80, 0.2), 0 8px 24px rgba(76, 175, 80, 0.2);
}

/* Wrong tap */
.tile.wrong {
  border-color: var(--c-error);
  background: linear-gradient(135deg, rgba(229, 115, 115, 0.08), rgba(239, 83, 80, 0.04));
  box-shadow: 0 0 0 4px rgba(229, 115, 115, 0.2);
  animation: wrongShake 0.4s ease;
}

@keyframes wrongShake {
  0%, 100% { transform: translateX(0); }
  25%      { transform: translateX(-8px); }
  75%      { transform: translateX(8px); }
}

/* Locked (during playback) */
.tile.locked {
  pointer-events: none;
}

/* BOTTOM */
.bottom {
  position: relative;
  z-index: 10;
  padding: 16px 24px 44px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  flex-shrink: 0;
}

/* OVERLAYS */
.overlay {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: rgba(250, 248, 243, 0.94);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 200;
  gap: 18px;
  padding: 30px;
  text-align: center;
  animation: fadeIn 0.35s ease;
}

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.overlay.hidden { display: none; }

/* Countdown */
.countdown-num {
  font-size: 110px;
  font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -4px;
  line-height: 1;
  animation: countIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes countIn {
  0%   { opacity: 0; transform: scale(0.5); }
  60%  { opacity: 1; transform: scale(1.15); }
  100% { opacity: 1; transform: scale(1); }
}

.countdown-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--c-slate);
  letter-spacing: 0.3px;
  text-align: center;
  max-width: 280px;
  line-height: 1.5;
}

html[lang="ar"] .countdown-label { font-family: var(--f-ar); font-size: 15px; }

/* Level Up */
.levelup-icon {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: var(--g-brand);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 20px 40px rgba(14, 124, 123, 0.4);
  animation: levelUpPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
}

.levelup-icon::after {
  content: '';
  position: absolute;
  inset: -12px;
  border-radius: 50%;
  border: 3px solid rgba(14, 124, 123, 0.3);
  animation: ringExpand 0.9s ease-out;
}

@keyframes ringExpand {
  0%   { transform: scale(0.6); opacity: 1; }
  100% { transform: scale(1.8); opacity: 0; }
}

@keyframes levelUpPop {
  0%   { transform: scale(0.3) rotate(-180deg); }
  60%  { transform: scale(1.15) rotate(10deg); }
  100% { transform: scale(1) rotate(0deg); }
}

.levelup-icon svg {
  width: 50px;
  height: 50px;
  stroke: #fff;
  stroke-width: 2.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.levelup-title {
  font-size: 26px;
  font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}

html[lang="ar"] .levelup-title { font-family: var(--f-ar); font-size: 25px; letter-spacing: 0; }

.levelup-sub {
  font-size: 13.5px;
  color: var(--c-slate);
  font-weight: 500;
  max-width: 280px;
  line-height: 1.55;
}

html[lang="ar"] .levelup-sub { font-family: var(--f-ar); font-size: 14.5px; }

/* Game Over */
.gameover-icon {
  width: 100px;
  height: 100px;
  border-radius: 50%;
  background: linear-gradient(135deg, #E57373, #EF5350);
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 20px 40px rgba(229, 115, 115, 0.4);
  animation: gameOverPop 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
}

@keyframes gameOverPop {
  0%   { transform: scale(0.3); }
  60%  { transform: scale(1.1); }
  100% { transform: scale(1); }
}

.gameover-icon svg {
  width: 50px;
  height: 50px;
  stroke: #fff;
  stroke-width: 2.8;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.gameover-title {
  font-size: 26px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.5px;
}

html[lang="ar"] .gameover-title { font-family: var(--f-ar); font-size: 25px; letter-spacing: 0; }

.gameover-sub {
  font-size: 13.5px;
  color: var(--c-slate);
  font-weight: 500;
  max-width: 280px;
  line-height: 1.55;
}

html[lang="ar"] .gameover-sub { font-family: var(--f-ar); font-size: 14.5px; }

.gameover-stats {
  display: flex;
  gap: 10px;
  margin-top: 4px;
}

.gameover-stat {
  padding: 12px 18px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  min-width: 80px;
}

.gameover-stat-value {
  font-size: 22px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.8px;
  line-height: 1;
  font-feature-settings: "tnum";
}

.gameover-stat-value.good { color: var(--c-success); }
.gameover-stat-value.blue { color: var(--c-primary); }

.gameover-stat-label {
  font-size: 10px;
  font-weight: 600;
  color: var(--c-slate);
  letter-spacing: 0.3px;
  text-transform: uppercase;
  text-align: center;
}

html[lang="ar"] .gameover-stat-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11px;
}

/* Buttons */
.btn-primary {
  position: relative;
  width: 100%;
  padding: 17px 24px;
  background: var(--g-brand);
  color: #fff;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.4px;
  border-radius: var(--r-md);
  overflow: hidden;
  box-shadow: 0 12px 28px rgba(14, 124, 123, 0.32);
  transition: transform 0.2s ease, box-shadow 0.25s ease;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  animation: fadeUp 0.6s ease 0.4s both;
}

.btn-primary::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  transition: left 0.7s ease;
}

.btn-primary:hover::before { left: 100%; }
.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 36px rgba(14, 124, 123, 0.4);
}
.btn-primary:active { transform: scale(0.97); }

.btn-primary .arrow {
  width: 16px; height: 16px;
  stroke: #fff;
  stroke-width: 2.4;
  fill: none;
  transition: transform 0.3s ease;
}

html[dir="rtl"] .btn-primary .arrow { transform: scaleX(-1); }
.btn-primary:hover .arrow { transform: translateX(4px); }
html[dir="rtl"] .btn-primary:hover .arrow { transform: scaleX(-1) translateX(4px); }

html[lang="ar"] .btn-primary { font-family: var(--f-ar); font-size: 16px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>

<body>

<div class="stage">
  <div class="phone">
    <div class="screen">

      <!-- Top Bar -->
      <div class="topbar">
        <button class="exit-btn" id="exitBtn" aria-label="Exit">
          <svg viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>

        <div class="hud">
          <div class="hud-box score">
            <svg viewBox="0 0 24 24">
              <polygon points="12 2 15 9 22 9 16 14 18 21 12 17 6 21 8 14 2 9 9 9"></polygon>
            </svg>
            <span id="hudScore">0</span>
          </div>

          <div class="hud-box level">
            <svg viewBox="0 0 24 24">
              <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
            </svg>
            <span id="hudLevel">1</span>
          </div>

          <div class="hud-box lives" id="hudLives">
            <svg class="heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <svg class="heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
            <svg class="heart" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="content">

        <!-- Status -->
        <div class="status-wrap">
          <div class="status-text" id="statusText">
            <span class="pulse-dot"></span>
            <span id="statusMain">Get ready...</span>
          </div>
          <div class="status-sub" id="statusSub"></div>
        </div>

        <!-- Progress Pips -->
        <div class="pips-row" id="pipsRow"></div>

        <!-- Play Area -->
        <div class="play-area" id="playArea">
          <!-- Filled by JS -->
        </div>

      </div>

      <!-- Countdown Overlay -->
      <div class="overlay" id="countdownOverlay">
        <div class="countdown-num" id="countdownNum">3</div>
        <div class="countdown-label" id="countdownLabel">Watch the sequence and repeat it</div>
      </div>

      <!-- Level Up Overlay -->
      <div class="overlay hidden" id="levelUpOverlay">
        <div class="levelup-icon">
          <svg viewBox="0 0 24 24">
            <polyline points="20 6 9 17 4 12"></polyline>
          </svg>
        </div>
        <div class="levelup-title" id="levelUpTitle">Level Up!</div>
        <div class="levelup-sub" id="levelUpSub">You got it right. Get ready for a longer sequence.</div>
      </div>

      <!-- Game Over Overlay -->
      <div class="overlay hidden" id="gameOverOverlay">
        <div class="gameover-icon">
          <svg viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="15" y1="9" x2="9" y2="15"></line>
            <line x1="9" y1="9" x2="15" y2="15"></line>
          </svg>
        </div>
        <div class="gameover-title" id="gameOverTitle">Great effort!</div>
        <div class="gameover-sub" id="gameOverSub">You ran out of lives. Try again to beat your score.</div>

        <div class="gameover-stats">
          <div class="gameover-stat">
            <div class="gameover-stat-value good" id="finalScore">0</div>
            <div class="gameover-stat-label" id="finalScoreLabel">Score</div>
          </div>
          <div class="gameover-stat">
            <div class="gameover-stat-value blue" id="finalLevel">1</div>
            <div class="gameover-stat-label" id="finalLevelLabel">Level</div>
          </div>
        </div>

        <button class="btn-primary" id="gameOverBtn" style="margin-top: 8px;">
          <span id="gameOverBtnLabel">Finish Exercise</span>
          <svg class="arrow" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </div>

    </div>
  </div>
</div>

<script>
/* ============================================
   TRANSLATIONS
============================================ */
const I18N = {
  en: {
    getReady: 'Get ready...',
    watchSequence: 'Watch the sequence',
    yourTurn: 'Your turn!',
    tapItems: 'Tap the items in the same order',
    correct: 'Correct!',
    wrong: 'Oops! Wrong item',
    tryAgain: 'Watch carefully this time',
    levelUp: 'Level Up!',
    levelUpSub: 'You got it right. Here comes a longer sequence.',
    gameOver: 'Great effort!',
    gameOverSub: 'You ran out of lives. Try again to beat your score.',
    score: 'Score',
    level: 'Level',
    finishExercise: 'Finish Exercise',
    countdownLabel: 'Watch the sequence and repeat it',
    seq: 'Sequence'
  },
  ar: {
    getReady: 'استعد...',
    watchSequence: 'شاهد التسلسل',
    yourTurn: 'دورك!',
    tapItems: 'اضغط على العناصر بنفس الترتيب',
    correct: 'صحيح!',
    wrong: 'أوووبس! عنصر خطأ',
    tryAgain: 'انتبه هذه المرة',
    levelUp: 'المستوى التالي!',
    levelUpSub: 'أصبت. هيبدأ تسلسل أطول.',
    gameOver: 'مجهود رائع!',
    gameOverSub: 'نفدت محاولاتك. جرّب تاني عشان تكسر رقمك.',
    score: 'النقاط',
    level: 'المستوى',
    finishExercise: 'إنهاء التمرين',
    countdownLabel: 'شاهد التسلسل وكرره',
    seq: 'تسلسل'
  }
};

/* ============================================
   EMOJI POOL
============================================ */
const EMOJI_POOL = ['🍎', '🐱', '🚗', '🌳', '⭐', '🎵', '📚', '⚽', '🎈', '🌸', '🔑', '💡', '🎨', '🐟', '🍕', '🌈'];

/* ============================================
   LANGUAGE
============================================ */
const STORAGE_KEY = 'memento_lang';
let currentLang = localStorage.getItem(STORAGE_KEY) || 'en';
const htmlEl = document.documentElement;

/* ============================================
   GAME STATE
============================================ */
const state = {
  tiles: [],              // 6 emoji tiles
  sequence: [],           // full sequence (indices)
  userInput: [],          // user's current input
  level: 1,
  score: 0,
  lives: 3,
  phase: 'idle',          // 'countdown' | 'showing' | 'input' | 'feedback' | 'levelup' | 'gameover'
  exerciseKey: 'memory',
  exerciseMinutes: 10
};

const TILE_COUNT = 6;
const STARTING_LENGTH = 3;
const MAX_LEVEL = 12;

/* ============================================
   DOM REFS
============================================ */
const playArea = document.getElementById('playArea');
const statusMain = document.getElementById('statusMain');
const statusSub = document.getElementById('statusSub');
const pipsRow = document.getElementById('pipsRow');
const hudScore = document.getElementById('hudScore');
const hudLevel = document.getElementById('hudLevel');
const hudLives = document.getElementById('hudLives');

/* ============================================
   LOAD EXERCISE
============================================ */
function loadExercise() {
  try {
    const ex = JSON.parse(localStorage.getItem('memento_current_exercise') || '{}');
    if (ex.key) state.exerciseKey = ex.key;
    if (ex.minutes) state.exerciseMinutes = ex.minutes;
  } catch (e) {}
  console.log('🎮 Exercise:', state.exerciseKey);
}

/* ============================================
   HELPERS
============================================ */
function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
  return arr;
}

function randomFrom(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function sleep(ms) {
  return new Promise(res => setTimeout(res, ms));
}

/* ============================================
   BUILD TILES
============================================ */
function buildTiles() {
  const pool = shuffle([...EMOJI_POOL]).slice(0, TILE_COUNT);
  state.tiles = pool;

  playArea.innerHTML = '';
  pool.forEach((emoji, idx) => {
    const tile = document.createElement('div');
    tile.className = 'tile idle';
    tile.dataset.idx = idx;
    tile.innerHTML = `<span class="tile-emoji">${emoji}</span>`;
    tile.addEventListener('click', () => onTileTap(idx));
    playArea.appendChild(tile);
  });
}

/* ============================================
   RENDER HUD
============================================ */
function updateHUD() {
  hudScore.textContent = state.score;
  hudLevel.textContent = state.level;

  // Lives
  const hearts = hudLives.querySelectorAll('.heart');
  hearts.forEach((h, i) => {
    if (i < state.lives) h.classList.remove('lost');
    else h.classList.add('lost');
  });
}

/* ============================================
   PIPS (progress for current sequence)
============================================ */
function renderPips(filledCount = 0) {
  pipsRow.innerHTML = '';
  const len = state.sequence.length;
  for (let i = 0; i < len; i++) {
    const pip = document.createElement('div');
    pip.className = 'pip';
    if (i < filledCount) pip.classList.add('filled');
    pipsRow.appendChild(pip);
  }
}

/* ============================================
   STATUS
============================================ */
function setStatus(mainText, subText = '') {
  statusMain.textContent = mainText;
  statusSub.textContent = subText;
}

/* ============================================
   START NEW GAME
============================================ */
async function startGame() {
  state.level = 1;
  state.score = 0;
  state.lives = 3;
  state.sequence = [];
  state.userInput = [];
  state.phase = 'idle';

  updateHUD();
  buildTiles();

  // Countdown overlay
  await showCountdown();

  await nextRound();
}

/* ============================================
   COUNTDOWN
============================================ */
async function showCountdown() {
  const overlay = document.getElementById('countdownOverlay');
  const num = document.getElementById('countdownNum');
  const label = document.getElementById('countdownLabel');
  const t = I18N[currentLang];

  label.textContent = t.countdownLabel;
  overlay.classList.remove('hidden');

  // 3 → 2 → 1 → GO!
  const seq = ['3', '2', '1', 'GO!'];
  for (const v of seq) {
    num.textContent = v;
    num.style.animation = 'none';
    void num.offsetWidth;
    num.style.animation = 'countIn 0.9s cubic-bezier(0.34, 1.56, 0.64, 1)';
    await sleep(v === 'GO!' ? 600 : 850);
  }

  overlay.classList.add('hidden');
}

/* ============================================
   NEXT ROUND (generate new sequence)
============================================ */
async function nextRound() {
  const t = I18N[currentLang];
  const seqLen = STARTING_LENGTH + (state.level - 1);
  state.sequence = [];
  state.userInput = [];

  // Generate sequence of tile indices
  for (let i = 0; i < seqLen; i++) {
    state.sequence.push(Math.floor(Math.random() * TILE_COUNT));
  }

  renderPips(0);
  setStatus(t.watchSequence, `${t.seq} ${seqLen}`);
  state.phase = 'showing';

  // Lock tiles
  document.querySelectorAll('.tile').forEach(t => t.classList.add('locked'));

  await sleep(700);

  // Play the sequence
  for (let i = 0; i < state.sequence.length; i++) {
    const tileIdx = state.sequence[i];
    const tileEl = playArea.querySelector(`.tile[data-idx="${tileIdx}"]`);

    // Highlight
    tileEl.classList.add('showing');
    await sleep(600);
    tileEl.classList.remove('showing');
    await sleep(220);
  }

  // Unlock & wait for input
  document.querySelectorAll('.tile').forEach(t => t.classList.remove('locked'));
  setStatus(t.yourTurn, t.tapItems);
  state.phase = 'input';
}

/* ============================================
   TILE TAP
============================================ */
async function onTileTap(idx) {
  if (state.phase !== 'input') return;
  if (state.userInput.length >= state.sequence.length) return;

  const t = I18N[currentLang];
  const tileEl = playArea.querySelector(`.tile[data-idx="${idx}"]`);

  // Add tap
  state.userInput.push(idx);
  const pos = state.userInput.length - 1;
  const expected = state.sequence[pos];

  // Render pip
  const pip = pipsRow.children[pos];
  if (pip) pip.classList.add('filled');

  if (idx === expected) {
    // ✅ Correct
    tileEl.classList.add('tapped');
    setTimeout(() => tileEl.classList.remove('tapped'), 250);

    if (state.userInput.length === state.sequence.length) {
      // Round complete!
      state.phase = 'feedback';
      await roundComplete();
    }
  } else {
    // ❌ Wrong
    state.phase = 'feedback';
    if (pip) {
      pip.classList.remove('filled');
      pip.classList.add('wrong');
    }
    tileEl.classList.add('wrong');
    setTimeout(() => tileEl.classList.remove('wrong'), 500);

    await roundFailed();
  }
}

/* ============================================
   ROUND COMPLETE
============================================ */
async function roundComplete() {
  const t = I18N[currentLang];
  state.score += 10 + state.level * 5;
  updateHUD();

  // Green pips
  Array.from(pipsRow.children).forEach(p => {
    p.classList.remove('filled');
    p.classList.add('correct');
  });

  setStatus(t.correct, '');

  // Level up overlay (only if not last)
  if (state.level >= MAX_LEVEL) {
    // Win condition
    await showGameOver(true);
    return;
  }

  await sleep(700);

  // Level Up overlay
  await showLevelUp();

  state.level++;
  updateHUD();
  await nextRound();
}

/* ============================================
   ROUND FAILED
============================================ */
async function roundFailed() {
  const t = I18N[currentLang];
  state.lives--;
  updateHUD();

  setStatus(t.wrong, t.tryAgain);

  await sleep(1200);

  if (state.lives <= 0) {
    await showGameOver(false);
    return;
  }

  // Retry same level
  await nextRound();
}

/* ============================================
   LEVEL UP OVERLAY
============================================ */
async function showLevelUp() {
  const t = I18N[currentLang];
  const overlay = document.getElementById('levelUpOverlay');
  document.getElementById('levelUpTitle').textContent = t.levelUp;
  document.getElementById('levelUpSub').textContent = t.levelUpSub;

  overlay.classList.remove('hidden');
  await sleep(1600);
  overlay.classList.add('hidden');
}

/* ============================================
   GAME OVER
============================================ */
async function showGameOver(isWin) {
  state.phase = 'gameover';
  const t = I18N[currentLang];
  const overlay = document.getElementById('gameOverOverlay');

  document.getElementById('finalScore').textContent = state.score;
  document.getElementById('finalLevel').textContent = state.level;
  document.getElementById('finalScoreLabel').textContent = t.score;
  document.getElementById('finalLevelLabel').textContent = t.level;
  document.getElementById('gameOverTitle').textContent = isWin ? '🏆 ' + t.levelUp : t.gameOver;
  document.getElementById('gameOverSub').textContent = isWin
    ? 'Amazing! You completed every level.'
    : t.gameOverSub;
  document.getElementById('gameOverBtnLabel').textContent = t.finishExercise;

  overlay.classList.remove('hidden');
}

/* ============================================
   SAVE RESULT + MARK DONE
============================================ */
function saveResultAndNext() {
  // Save result
  const result = {
    score: state.score,
    level: state.level,
    accuracy: Math.round((state.score / (MAX_LEVEL * 15)) * 100) || 0,
    timestamp: Date.now()
  };
  localStorage.setItem('memento_last_exercise_result', JSON.stringify(result));

  // Mark current exercise as done in queue
  try {
    const idx = parseInt(localStorage.getItem('memento_current_exercise_idx') || '0');
    let queue = JSON.parse(localStorage.getItem('memento_workout_queue') || '[]');
    if (queue[idx]) queue[idx].done = true;
    localStorage.setItem('memento_workout_queue', JSON.stringify(queue));

    // Also save to skill results (for cognitive profile)
    const key = 'memento_' + state.exerciseKey + '_result';
    const existing = JSON.parse(localStorage.getItem(key) || '{}');
    existing.accuracy = result.accuracy;
    existing.lastScore = state.score;
    existing.lastLevel = state.level;
    localStorage.setItem(key, JSON.stringify(existing));
  } catch (e) {
    console.error(e);
  }

  // Go back to instructions (which will detect queue and route properly)
  window.location.href = 'exercise-instructions.html';
}

/* ============================================
   LANGUAGE
============================================ */
function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';
}

/* ============================================
   EVENTS
============================================ */
document.getElementById('exitBtn').addEventListener('click', () => {
  if (confirm(currentLang === 'en'
    ? 'Exit exercise? Your progress will be lost.'
    : 'هل تريد الخروج من التمرين؟ ستفقد تقدمك.')) {
    window.location.href = 'exercise-instructions.html';
  }
});

document.getElementById('gameOverBtn').addEventListener('click', () => {
  saveResultAndNext();
});

/* ============================================
   INIT
============================================ */
applyLanguage(currentLang);
loadExercise();
startGame();
</script>

</body>
</html>
