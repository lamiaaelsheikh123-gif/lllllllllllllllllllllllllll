<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<meta name="theme-color" content="#FAF8F3" />
<title>Memento AI — Home</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Cairo:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
/* ============================================
   DESIGN TOKENS
============================================ */
:root {
  --c-primary: #0E7C7B;
  --c-primary-light: #4DB6AC;
  --c-secondary: #9B7EDE;
  --c-blue: #5B9BD5;
  --c-navy: #0F2C4C;
  --c-slate: #5A6C7D;
  --c-bg: #FAF8F3;
  --c-card: #FFFFFF;
  --c-border: #EAE6DE;
  --c-error: #E57373;
  --c-success: #4CAF50;
  --c-warning: #FF9800;
  --c-fire: #FF6B35;

  --g-brand: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 55%, #9B7EDE 100%);
  --g-text: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 50%, #9B7EDE 100%);
  --g-fire: linear-gradient(135deg, #FF6B35, #FF9800, #FFB74D);
  --g-hero: linear-gradient(135deg, #0E7C7B 0%, #5B9BD5 60%, #9B7EDE 100%);

  --r-sm: 10px;
  --r-md: 14px;
  --r-lg: 18px;
  --r-xl: 24px;
  --r-pill: 999px;

  --sh-soft: 0 8px 30px rgba(15, 44, 76, 0.06);
  --sh-glow: 0 20px 60px rgba(14, 124, 123, 0.18);
  --sh-hero: 0 20px 40px rgba(14, 124, 123, 0.32);

  --f-en: 'Poppins', system-ui, sans-serif;
  --f-ar: 'Cairo', system-ui, sans-serif;

  --phone-w: 375px;
  --phone-h: 812px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  font-family: var(--f-en);
  -webkit-font-smoothing: antialiased;
  background: #E8E4DC;
  overflow: hidden;
}

html[lang="ar"] body { font-family: var(--f-ar); }

button { font-family: inherit; cursor: pointer; border: none; background: none; }

/* ============================================
   PHONE FRAME
============================================ */
.stage {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background:
    radial-gradient(circle at 20% 20%, rgba(155, 126, 222, 0.12), transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(14, 124, 123, 0.10), transparent 50%),
    #E8E4DC;
}

.phone {
  position: relative;
  width: var(--phone-w);
  height: var(--phone-h);
  max-height: calc(100vh - 40px);
  background: var(--c-bg);
  border-radius: 44px;
  overflow: hidden;
  box-shadow:
    0 0 0 10px #1a1a1a,
    0 0 0 12px #2a2a2a,
    0 40px 80px rgba(0, 0, 0, 0.35),
    0 20px 40px rgba(0, 0, 0, 0.15);
}

.phone::before {
  content: '';
  position: absolute;
  top: 0; left: 50%;
  transform: translateX(-50%);
  width: 130px; height: 26px;
  background: #1a1a1a;
  border-radius: 0 0 18px 18px;
  z-index: 100;
}

@media (max-width: 480px) {
  body { background: var(--c-bg); }
  .stage { padding: 0; background: var(--c-bg); }
  .phone {
    width: 100vw; height: 100vh;
    max-height: 100vh;
    border-radius: 0; box-shadow: none;
  }
  .phone::before { display: none; }
}

/* ============================================
   SCREEN
============================================ */
.screen {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: var(--c-bg);
  overflow: hidden;
}

.screen::before {
  content: '';
  position: fixed;
  inset: 0;
  background:
    radial-gradient(circle at 20% 10%, rgba(155, 126, 222, 0.10), transparent 45%),
    radial-gradient(circle at 85% 90%, rgba(14, 124, 123, 0.08), transparent 50%);
  pointer-events: none;
  z-index: 0;
}

/* ============================================
   HEADER
============================================ */
.header {
  position: relative;
  z-index: 10;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 52px 22px 0;
  flex-shrink: 0;
}

.header-left {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.header-greet {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--c-slate);
  letter-spacing: 0.2px;
  opacity: 0;
  animation: fadeUp 0.5s ease 0.1s forwards;
}

html[lang="ar"] .header-greet { font-family: var(--f-ar); font-size: 13.5px; }

.header-name {
  font-size: 22px;
  font-weight: 800;
  background: var(--g-text);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
  line-height: 1.15;
  opacity: 0;
  animation: fadeUp 0.5s ease 0.15s forwards;
}

html[lang="ar"] .header-name { font-family: var(--f-ar); font-size: 21px; letter-spacing: 0; }

.header-actions {
  display: flex;
  gap: 8px;
  opacity: 0;
  animation: fadeUp 0.5s ease 0.2s forwards;
}

.icon-btn {
  position: relative;
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(14, 124, 123, 0.15);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.25s ease;
  box-shadow: 0 4px 14px rgba(15, 44, 76, 0.05);
}

.icon-btn:hover {
  background: #fff;
  border-color: rgba(14, 124, 123, 0.35);
  transform: translateY(-2px);
}

.icon-btn:active { transform: scale(0.95); }

.icon-btn svg {
  width: 18px; height: 18px;
  stroke: var(--c-navy);
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.icon-btn .lang-mini {
  font-size: 11px;
  font-weight: 700;
  color: var(--c-primary);
  letter-spacing: 0.3px;
}

@keyframes fadeUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ============================================
   CONTENT
============================================ */
.content {
  position: relative;
  z-index: 5;
  flex: 1;
  padding: 16px 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow-y: auto;
  scrollbar-width: none;
  min-height: 0;
}

.content::-webkit-scrollbar { display: none; }

/* ============================================
   STREAK + STATS ROW
============================================ */
.stats-row {
  display: grid;
  grid-template-columns: 1.2fr 1fr 1fr;
  gap: 8px;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeUp 0.5s ease 0.25s forwards;
}

.stat-mini {
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-md);
  padding: 10px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
  position: relative;
  overflow: hidden;
  transition: all 0.25s ease;
}

.stat-mini:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(15, 44, 76, 0.06);
}

.stat-mini.streak {
  background: var(--g-fire);
  border-color: transparent;
  box-shadow: 0 8px 22px rgba(255, 107, 53, 0.35);
  position: relative;
}

.stat-mini.streak::after {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.3) 0%, transparent 60%);
  pointer-events: none;
}

.stat-mini.streak .stat-mini-icon {
  color: #fff;
  animation: fireWiggle 2s ease-in-out infinite;
}

@keyframes fireWiggle {
  0%, 100% { transform: scale(1) rotate(0deg); }
  25%      { transform: scale(1.1) rotate(-5deg); }
  75%      { transform: scale(1.1) rotate(5deg); }
}

.stat-mini.streak .stat-mini-value { color: #fff; }
.stat-mini.streak .stat-mini-label { color: rgba(255, 255, 255, 0.9); }

.stat-mini-icon {
  font-size: 18px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
}

.stat-mini-icon svg {
  width: 18px;
  height: 18px;
  stroke: var(--c-primary);
  stroke-width: 2.2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.stat-mini-value {
  font-size: 17px;
  font-weight: 800;
  color: var(--c-navy);
  letter-spacing: -0.5px;
  line-height: 1;
  font-feature-settings: "tnum";
}

.stat-mini-label {
  font-size: 9px;
  font-weight: 600;
  color: var(--c-slate);
  letter-spacing: 0.3px;
  text-transform: uppercase;
  text-align: center;
  line-height: 1.2;
}

html[lang="ar"] .stat-mini-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 10px;
}

/* ============================================
   HERO CARD
============================================ */
.hero-card {
  position: relative;
  background: var(--g-hero);
  border-radius: var(--r-xl);
  padding: 22px 20px;
  display: flex;
  flex-direction: column;
  gap: 16px;
  overflow: hidden;
  box-shadow: var(--sh-hero);
  opacity: 0;
  transform: translateY(18px);
  animation: fadeUp 0.6s ease 0.35s forwards;
}

.hero-card::before {
  content: '';
  position: absolute;
  top: -30%; right: -20%;
  width: 200px;
  height: 200px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
  pointer-events: none;
}

.hero-card::after {
  content: '';
  position: absolute;
  bottom: -40%; left: -20%;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
  pointer-events: none;
}

.hero-top {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}

.hero-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  flex: 1;
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 4px 10px;
  background: rgba(255, 255, 255, 0.2);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  border-radius: var(--r-pill);
  font-size: 10px;
  font-weight: 700;
  color: #fff;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  align-self: flex-start;
}

html[lang="ar"] .hero-tag {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 11px;
}

.hero-tag svg {
  width: 11px; height: 11px;
  stroke: currentColor;
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hero-title {
  font-size: 22px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.4px;
  line-height: 1.2;
  margin-top: 2px;
}

html[lang="ar"] .hero-title { font-family: var(--f-ar); font-size: 21px; letter-spacing: 0; }

.hero-sub {
  font-size: 12.5px;
  font-weight: 500;
  color: rgba(255, 255, 255, 0.85);
  letter-spacing: 0.1px;
}

html[lang="ar"] .hero-sub { font-family: var(--f-ar); font-size: 13.5px; }

.hero-illus {
  width: 60px;
  height: 60px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.25);
  position: relative;
}

.hero-illus svg {
  width: 32px;
  height: 32px;
  stroke: #fff;
  stroke-width: 2;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.hero-sessions {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 12px 14px;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.18);
  border-radius: var(--r-md);
}

.session-row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.session-row + .session-row {
  padding-top: 8px;
  border-top: 1px solid rgba(255, 255, 255, 0.12);
}

.session-icon-small {
  width: 26px;
  height: 26px;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.2);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.session-icon-small svg {
  width: 13px; height: 13px;
  stroke: #fff;
  stroke-width: 2.3;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.session-name-small {
  flex: 1;
  font-size: 12.5px;
  font-weight: 600;
  color: #fff;
  letter-spacing: 0.1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

html[lang="ar"] .session-name-small { font-family: var(--f-ar); font-size: 13.5px; letter-spacing: 0; }

.session-time-small {
  font-size: 11px;
  font-weight: 700;
  color: rgba(255, 255, 255, 0.9);
  font-feature-settings: "tnum";
}

html[lang="ar"] .session-time-small { font-family: var(--f-ar); font-size: 12px; }

.hero-empty {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  padding: 16px;
  background: rgba(255, 255, 255, 0.12);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  border: 1px dashed rgba(255, 255, 255, 0.3);
  border-radius: var(--r-md);
  text-align: center;
}

.hero-empty-icon { font-size: 24px; }

.hero-empty-text {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  line-height: 1.4;
}

html[lang="ar"] .hero-empty-text { font-family: var(--f-ar); font-size: 14px; }

.hero-bottom {
  position: relative;
  z-index: 2;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}

.hero-total {
  display: flex;
  flex-direction: column;
  gap: 1px;
}

.hero-total-label {
  font-size: 9.5px;
  font-weight: 600;
  color: rgba(255, 255, 255, 0.75);
  letter-spacing: 0.4px;
  text-transform: uppercase;
}

html[lang="ar"] .hero-total-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 10.5px;
}

.hero-total-value {
  font-size: 16px;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.4px;
  font-feature-settings: "tnum";
}

.hero-start-btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 12px 20px;
  background: #fff;
  color: var(--c-primary);
  font-size: 13.5px;
  font-weight: 700;
  letter-spacing: 0.3px;
  border-radius: var(--r-md);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
  transition: all 0.25s ease;
  position: relative;
  overflow: hidden;
}

.hero-start-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(14, 124, 123, 0.1), transparent);
  transition: left 0.6s ease;
}

.hero-start-btn:hover::before { left: 100%; }

.hero-start-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.2);
}

.hero-start-btn:active { transform: scale(0.96); }

.hero-start-btn svg {
  width: 14px; height: 14px;
  stroke: currentColor;
  stroke-width: 2.5;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

html[lang="ar"] .hero-start-btn { font-family: var(--f-ar); font-size: 14.5px; }

/* ============================================
   SECTION HEAD
============================================ */
.section-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-inline-start: 4px;
  margin-top: 4px;
  opacity: 0;
  transform: translateY(12px);
  animation: fadeUp 0.5s ease 0.55s forwards;
}

.section-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--c-navy);
  letter-spacing: 0.2px;
  display: flex;
  align-items: center;
  gap: 8px;
}

.section-title::before {
  content: '';
  width: 3px;
  height: 14px;
  background: var(--g-brand);
  border-radius: var(--r-pill);
}

html[lang="ar"] .section-title { font-family: var(--f-ar); font-size: 14.5px; letter-spacing: 0; }

.section-link {
  font-size: 11.5px;
  font-weight: 600;
  color: var(--c-primary);
  letter-spacing: 0.2px;
  transition: opacity 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.section-link:hover { opacity: 0.7; }

.section-link svg {
  width: 12px; height: 12px;
  stroke: currentColor;
  stroke-width: 2.4;
  fill: none;
  stroke-linecap: round;
  stroke-linejoin: round;
}

html[dir="rtl"] .section-link svg { transform: scaleX(-1); }

html[lang="ar"] .section-link { font-family: var(--f-ar); font-size: 12.5px; letter-spacing: 0; }

/* ============================================
   WEEKLY PROGRESS CHART
============================================ */
.progress-card {
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-xl);
  padding: 18px 16px 14px;
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeUp 0.5s ease 0.65s forwards;
}

.progress-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%;
  height: 4px;
  background: var(--g-brand);
}

.progress-chart {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 6px;
  height: 90px;
  padding: 4px 0 8px;
}

.chart-day {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  height: 100%;
  justify-content: flex-end;
}

.chart-bar-wrap {
  width: 100%;
  flex: 1;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  position: relative;
}

.chart-bar {
  width: 70%;
  max-width: 20px;
  border-radius: 6px 6px 3px 3px;
  background: var(--g-brand);
  transition: height 1s cubic-bezier(0.65, 0, 0.35, 1);
  position: relative;
  min-height: 6px;
  box-shadow: 0 4px 12px rgba(14, 124, 123, 0.2);
}

.chart-day.today .chart-bar {
  background: var(--g-fire);
  box-shadow: 0 4px 12px rgba(255, 107, 53, 0.35);
}

.chart-day.empty .chart-bar {
  background: rgba(14, 124, 123, 0.1);
  box-shadow: none;
  height: 6px !important;
}

.chart-day-label {
  font-size: 9.5px;
  font-weight: 700;
  color: var(--c-slate);
  letter-spacing: 0.3px;
  text-transform: uppercase;
}

html[lang="ar"] .chart-day-label {
  font-family: var(--f-ar);
  text-transform: none;
  letter-spacing: 0;
  font-size: 10.5px;
}

.chart-day.today .chart-day-label { color: var(--c-fire); }

.chart-value {
  position: absolute;
  top: -16px;
  font-size: 9.5px;
  font-weight: 700;
  color: var(--c-primary);
  font-feature-settings: "tnum";
  opacity: 0;
  transition: opacity 0.3s ease 0.7s;
}

.chart-value.visible { opacity: 1; }

.chart-day.today .chart-value { color: var(--c-fire); }

/* ============================================
   BOTTOM QUICK ACTIONS
============================================ */
.quick-actions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  opacity: 0;
  transform: translateY(14px);
  animation: fadeUp 0.5s ease 0.75s forwards;
}

.quick-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 14px;
  background: #fff;
  border: 1.5px solid var(--c-border);
  border-radius: var(--r-lg);
  transition: all 0.25s ease;
  text-align: start;
  position: relative;
  overflow: hidden;
}

.quick-btn:hover {
  transform: translateY(-2px);
  border-color: rgba(14, 124, 123, 0.3);
  box-shadow: 0 10px 24px rgba(15, 44, 76, 0.06);
}

.quick-btn:active { transform: scale(0.97); }

.quick-icon {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  position: relative;
  overflow: hidden;

============================================ */

const langMiniEl  = document.getElementById('langMini');
const langBtn     = document.getElementById('langBtn');

function applyLanguage(lang) {
  currentLang = lang;
  localStorage.setItem(STORAGE_KEY, lang);
  htmlEl.lang = lang;
  htmlEl.dir  = lang === 'ar' ? 'rtl' : 'ltr';

  langMiniEl.textContent = lang === 'en' ? 'EN' : 'ع';

  const t = I18N[lang];

  const hour = new Date().getHours();

  else if (hour >= 17 || hour < 5) greetKey = 'greetEvening';

/* ============================================
   NAME
============================================ */

  document.getElementById('userName').textContent = name;

/* ============================================
   ✅ TODAY'S SESSIONS — FIXED
============================================ */
function getTodaySessions() {
  const dayOrder = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const todayIdx = new Date().getDay();
  const todayKey = dayOrder[todayIdx];

  // === DEBUG ===
  console.log('━━━ HOME DEBUG ━━━');
  console.log('Today index:', todayIdx, '→ key:', todayKey);
  console.log('memento_days:', localStorage.getItem('memento_days'));
  console.log('memento_personalized_plan:', localStorage.getItem('memento_personalized_plan'));
  console.log('memento_user_name:', localStorage.getItem('memento_user_name'));
  console.log('━━━━━━━━━━━━━━━━');

  // Plan
  let plan = [];
  try {
    plan = JSON.parse(localStorage.getItem('memento_personalized_plan') || '[]');
  } catch (e) { plan = []; }

  if (!plan || plan.length === 0) {
    console.warn('⚠️ No plan found — using fallback plan');
    plan = [
      { key: 'memory',    rank: 1, sessions: 3, minutes: 10 },
      { key: 'attention', rank: 2, sessions: 2, minutes: 10 },
      { key: 'speed',     rank: 3, sessions: 2, minutes: 8  }
    ];
  }

  // ✅ FIX: Training Days → Fallback to ALL 7 days
  let trainingDays = [];
  try {
    trainingDays = JSON.parse(localStorage.getItem('memento_days') || '[]');
  } catch (e) { trainingDays = []; }

  if (!trainingDays || trainingDays.length === 0) {
    console.warn('⚠️ No training days found — using ALL 7 days');
    // ✅ CHANGED: Was ['sun','tue','thu','sat'] — now all 7 days
    trainingDays = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  }

  const dayMap = { sun: 0, mon: 1, tue: 2, wed: 3, thu: 4, fri: 5, sat: 6 };
  const sortedDays = [...trainingDays].sort((a, b) => dayMap[a] - dayMap[b]);

  // Flat sessions
  const allSessions = [];
  plan.forEach(p => {
    for (let i = 0; i < p.sessions; i++) {
      allSessions.push({ key: p.key, minutes: p.minutes, rank: p.rank });
    }
  });

  // Distribute round-robin
  const daySessions = {};
  sortedDays.forEach(d => { daySessions[d] = []; });
  allSessions.forEach((sess, i) => {
    const day = sortedDays[i % sortedDays.length];
    daySessions[day].push(sess);
  });

  const result = daySessions[todayKey] || [];
  console.log('→ Today sessions:', result);
  console.log('→ daySessions map:', daySessions);

  return result;
}

/* ============================================
   RENDER HERO
============================================ */
function renderHero() {
  const t = I18N[currentLang];
  const sessions = getTodaySessions();
  const container = document.getElementById('heroSessions');
  const heroTitle = document.getElementById('heroTitle');
  const heroSub   = document.getElementById('heroSub');
  const startBtn  = document.getElementById('startWorkoutBtn');

  if (sessions.length === 0) {
    heroTitle.textContent = t.heroRestTitle;
    heroSub.textContent   = t.heroRestSub;
    container.innerHTML = `
      <div class="hero-empty">
        <span class="hero-empty-icon">😴</span>
        <div class="hero-empty-text">${t.restDayText}</div>
      </div>
    `;
    document.getElementById('heroTotalMin').textContent = 0;
    startBtn.style.display = 'none';
    return;
  }

  heroTitle.textContent = t.heroTitle;
  heroSub.textContent   = t.heroSub;
  startBtn.style.display = '';

  const sessionsHtml = sessions.map(s => `
    <div class="session-row">
      <div class="session-icon-small">${SKILL_ICONS[s.key]}</div>
      <div class="session-name-small">${t.skills[s.key]}</div>
      <div class="session-time-small">${s.minutes} ${t.minutesUnit}</div>
    </div>
  `).join('');

  container.innerHTML = `<div class="hero-sessions">${sessionsHtml}</div>`;

  const total = sessions.reduce((sum, s) => sum + s.minutes, 0);
  document.getElementById('heroTotalMin').textContent = total;
}

/* ============================================
   RENDER CHART
============================================ */
function renderChart() {
  const t = I18N[currentLang];
  const container = document.getElementById('progressChart');
  container.innerHTML = '';

  const todayIdx = new Date().getDay();

  // ✅ Read real training days
  let trainingDays = [];
  try {
    trainingDays = JSON.parse(localStorage.getItem('memento_days') || '[]');
  } catch (e) { trainingDays = []; }
  if (!trainingDays || trainingDays.length === 0) {
    trainingDays = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  }

  const dayOrder = ['sun', 'mon', 'tue', 'wed', 'thu', 'fri', 'sat'];
  const trainingIdxs = trainingDays.map(d => dayOrder.indexOf(d));

  const weekData = [0, 1, 2, 3, 4, 5, 6].map((dayIdx) => {
    const isTrainingDay = trainingIdxs.includes(dayIdx);
    if (!isTrainingDay) return { dayIdx, score: 0, isToday: dayIdx === todayIdx };

    const base = 50 + (dayIdx * 6);
    return {
      dayIdx,
      score: Math.min(95, base + Math.floor(Math.random() * 15)),
      isToday: dayIdx === todayIdx
    };
  });

  const maxScore = Math.max(...weekData.map(d => d.score), 1);

  weekData.forEach(d => {
    const barHeight = d.score === 0 ? 0 : (d.score / maxScore) * 100;

    const day = document.createElement('div');
    day.className = 'chart-day';
    if (d.isToday) day.classList.add('today');
    if (d.score === 0) day.classList.add('empty');

    day.innerHTML = `
      <div class="chart-bar-wrap">
        ${d.score > 0 ? `<div class="chart-value" data-val="${d.score}">${d.score}%</div>` : ''}
        <div class="chart-bar" style="height: 0%" data-height="${barHeight}"></div>
      </div>
      <div class="chart-day-label">${t.dayShort[d.dayIdx]}</div>
    `;

    container.appendChild(day);
  });

  setTimeout(() => {
    document.querySelectorAll('.chart-bar').forEach(bar => {
      bar.style.height = bar.dataset.height + '%';
    });
    document.querySelectorAll('.chart-value').forEach(v => {
      v.classList.add('visible');
    });
  }, 200);
}
